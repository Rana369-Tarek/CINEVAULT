name: cinevault
description: A cinematic movie discovery library.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - data/movies.json
    - assets/posters/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/cinevault_icon.png"
  min_sdk_android: 21